<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f5f7fb">

    <title>Cours — Apprendre les sons</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- =========================================
             NAVIGATION COURS / EXERCICES
        ========================================== -->

        <nav class="main-tabs">

            <a
                href="index.html"
                class="main-tab active"
            >
                Cours
            </a>

            <a
                href="exercices.html"
                class="main-tab"
            >
                Exercices
            </a>

        </nav>


        <!-- =========================================
             PROGRESSION
        ========================================== -->

        <header class="topbar">

            <div class="topbar-info">

                <span id="counter">
                    1 / 39
                </span>

                <span id="percentage">
                    0%
                </span>

            </div>


            <div class="progress-track">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </header>


        <!-- =========================================
             WIZARD DES SONS
        ========================================== -->

        <section class="wizard">

            <div
                id="cardContainer"
                class="card-container"
            ></div>

        </section>


        <!-- =========================================
             NAVIGATION PRÉCÉDENT / VALIDATION / SUIVANT
        ========================================== -->

        <nav class="navigation">

            <button
                id="previousButton"
                class="nav-button"
                aria-label="Son précédent"
            >
                ←
            </button>


            <button
                id="validateButton"
                class="validate-button"
            >

                <span class="validate-icon">
                    ✓
                </span>

                <span id="validateText">
                    J'ai compris
                </span>

            </button>


            <button
                id="nextButton"
                class="nav-button"
                aria-label="Son suivant"
            >
                →
            </button>

        </nav>

    </main>


    <!-- =========================================
         ÉCRAN FINAL
    ========================================== -->

    <section
        id="successScreen"
        class="success-screen"
    >

        <div class="success-content">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Bravo !
            </h1>

            <p>
                Tous les sons sont terminés.
            </p>

            <div class="success-progress">
                100%
            </div>

            <button
                id="restartButton"
                class="restart-button"
            >
                Recommencer
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
